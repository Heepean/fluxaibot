[package]
name = "local_ai_hub"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Local AI Hub — Windows desktop app for GGUF models and coding-agent integrations"
authors = ["Local AI Hub"]
rust-version = "1.74"

[lib]
name = "local_ai_hub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "local_ai_hub"
path = "src/main.rs"

[dependencies]
# Core async runtime
tokio = { version = "1.43", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
toml_edit = "0.22"

# HTTP
axum = { version = "0.7", features = ["macros", "http1"] }
axum-extra = { version = "0.9", features = ["typed-header"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "limit", "trace"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
http = "1"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-native-tls", "sqlite", "macros", "migrate"] }

# Filesystem / hashing
sha2 = "0.10"
walkdir = "2"
globset = "0.4"
path-clean = "0.1"

# Process management
which = "8"
sysinfo = "0.33"

# Windows platform
[target.'cfg(windows)'.dependencies]
winreg = "0.52"

# Tauri
tauri = { version = "2", features = ["tray-icon", "unstable"] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde_bytes = "0.11"

# Error handling
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter", "fmt", "std"] }
tracing-appender = "0.2"

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
bytes = "1"
futures = "0.3"
futures-util = "0.3"
rand = "0.8"
hex = "0.4"
url = "2"
percent-encoding = "2"
base64 = "0.22"
regex = "1"
once_cell = "1"
dashmap = "6"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
secrecy = "0.10"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tokio-test = "0.4"
mockall = "0.14"
pretty_assertions = "1"
tempfile = "3"
